services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cardtable
      POSTGRES_PASSWORD: cardtable
      POSTGRES_DB: cardtable
    ports:
      - "5432:5432"
    volumes:
      - card_table_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - card_table_redis:/data
volumes:
  card_table_postgres:
  card_table_redis:
